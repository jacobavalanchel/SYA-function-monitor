name: Release Function Artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.2.0"
      version:
        description: "Artifact version, for example 0.1.0"
        required: true
        default: "0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish monitor artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          manifest_version="$(node -p "require('./manifest.json').version")"
          version="${{ inputs.version }}"
          if [[ -z "${version}" ]]; then
            version="${manifest_version}"
          fi
          package_version="$(node -p "require('./package.json').version")"
          openapi_version="$(node -p "require('./api.openapi.json').info.version")"
          test "${tag}" = "v${version}"
          test "${version}" = "${manifest_version}"
          test "${version}" = "${package_version}"
          test "${version}" = "${openapi_version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test Python runtime
        run: |
          python -m pip install Pillow==11.3.0
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Validate release contract files
        run: |
          test -f manifest.json
          test -f api.openapi.json
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('api.openapi.json', 'utf8'))"

      - name: Stage runtime package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/stage/bin release/stage/assets release/out
          cp manifest.json api.openapi.json README.md package.json module.json release/stage/
          cp -R dist release/stage/dist
          cp index.html server.py realsense_runtime.py config.example.json release/stage/assets/
          cp requirements-realsense.txt release/stage/
          cp -R scripts patches release/stage/
          cat > release/stage/bin/monitor-server <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          module_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          python_candidates=(
            "${MONITOR_PYTHON:-}"
            "$HOME/.sya/monitor/.venv/bin/python3"
            "python3"
          )
          for python_bin in "${python_candidates[@]}"; do
            if [[ -n "${python_bin}" ]] && command -v "${python_bin}" >/dev/null 2>&1; then
              exec "${python_bin}" "${module_root}/assets/server.py" "$@"
            fi
          done
          echo "No usable Python interpreter found for monitor runtime." >&2
          exit 127
          SCRIPT
          cat > release/stage/bin/monitor-server.cmd <<'SCRIPT'
          @echo off
          set MODULE_ROOT=%~dp0..
          if defined MONITOR_PYTHON (
            "%MONITOR_PYTHON%" "%MODULE_ROOT%\assets\server.py" %*
          ) else if exist "%USERPROFILE%\.sya\monitor\.venv\Scripts\python.exe" (
            "%USERPROFILE%\.sya\monitor\.venv\Scripts\python.exe" "%MODULE_ROOT%\assets\server.py" %*
          ) else (
            python "%MODULE_ROOT%\assets\server.py" %*
          )
          SCRIPT
          chmod +x release/stage/bin/monitor-server
          test -f release/stage/manifest.json
          test -f release/stage/api.openapi.json
          test -x release/stage/bin/monitor-server
          test -f release/stage/bin/monitor-server.cmd
          test -d release/stage/assets
          test -f release/stage/assets/realsense_runtime.py
          test -x release/stage/scripts/realsense-l515
          test -f release/stage/patches/librealsense-v2.54.2-macos-l515.patch

      - name: Smoke test staged runtime API
        shell: bash
        run: |
          set -euo pipefail
          export PORT=9876
          ./release/stage/bin/monitor-server > release/monitor-smoke.log 2>&1 &
          server_pid="$!"
          cleanup() {
            kill "${server_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const baseUrl = 'http://127.0.0.1:9876';
          const openApi = JSON.parse(readFileSync('release/stage/api.openapi.json', 'utf8'));

          function responseContent(operation) {
            return operation.responses?.['200']?.content || {};
          }

          function isEventStream(operation) {
            return Boolean(responseContent(operation)['text/event-stream']);
          }

          function requestBodyFor(operation) {
            const requestBody = operation.requestBody;
            if (!requestBody) return undefined;
            const schema = requestBody.content?.['application/json']?.schema;
            if (Array.isArray(schema?.required) && schema.required.length > 0) return null;
            return {};
          }

          function discoverTests() {
            const tests = [];
            for (const [path, pathItem] of Object.entries(openApi.paths || {})) {
              if (path.includes('{') || path.includes('}')) continue;
              for (const method of ['get']) {
                const operation = pathItem?.[method];
                if (!operation) continue;
                if (isEventStream(operation)) continue;
                if (!responseContent(operation)['application/json']) continue;
                const body = method === 'post' ? requestBodyFor(operation) : undefined;
                if (body === null) continue;
                tests.push({
                  method: method.toUpperCase(),
                  path,
                  body,
                  expectEnvelope: path !== '/manifest',
                });
              }
            }
            return tests;
          }

          async function waitForHealth() {
            const deadline = Date.now() + 10000;
            let lastError;
            while (Date.now() < deadline) {
              try {
                const response = await fetch(`${baseUrl}/health`);
                if (response.ok) return;
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error(`monitor runtime did not become healthy: ${lastError?.message || 'timeout'}`);
          }

          await waitForHealth();
          const tests = discoverTests();
          if (tests.length === 0) throw new Error('api.openapi.json has no testable JSON endpoints');
          for (const test of tests) {
            const init = { method: test.method };
            if (test.body !== undefined) {
              init.headers = { 'Content-Type': 'application/json' };
              init.body = JSON.stringify(test.body);
            }
            const response = await fetch(`${baseUrl}${test.path}`, init);
            if (!response.ok) {
              throw new Error(`${test.method} ${test.path} returned HTTP ${response.status}`);
            }
            const body = await response.json();
            if (test.expectEnvelope && body.ok !== true) {
              throw new Error(`${test.method} ${test.path} did not return a successful FunctionResponse envelope`);
            }
          }
          console.log(`OpenAPI smoke tested ${tests.length} endpoints.`);
          NODE

      - name: Create platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          platforms=(
            "macos-arm64:zip"
            "macos-x64:zip"
            "windows-x64:zip"
            "linux-x64:tar.gz"
          )
          for item in "${platforms[@]}"; do
            platform="${item%%:*}"
            ext="${item#*:}"
            name="sya-function-monitor-${version}-${platform}.${ext}"
            if [[ "${ext}" == "zip" ]]; then
              (cd release/stage && zip -qr "../out/${name}" .)
            else
              tar -czf "release/out/${name}" -C release/stage .
            fi
          done
          (cd release/out && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Monitor Function ${{ steps.meta.outputs.tag }}
          body: |
            Runtime artifacts for the SYA monitor function.

            Each archive contains manifest.json, api.openapi.json, bin/, assets/, README.md, and compiled adapter output.
          files: release/out/*
          fail_on_unmatched_files: true
          make_latest: false
