name: Release Function Artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.2.0"
      version:
        description: "Artifact version, for example 0.1.0"
        required: true
        default: "0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish monitor artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          manifest_version="$(node -p "require('./manifest.json').version")"
          version="${{ inputs.version }}"
          if [[ -z "${version}" ]]; then
            version="${manifest_version}"
          fi
          package_version="$(node -p "require('./package.json').version")"
          openapi_version="$(node -p "require('./api.openapi.json').info.version")"
          test "${tag}" = "v${version}"
          test "${version}" = "${manifest_version}"
          test "${version}" = "${package_version}"
          test "${version}" = "${openapi_version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test Python runtime
        run: |
          python -m pip install Pillow==11.3.0
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Test release validation tools
        run: |
          node tests/test_release_digest.mjs
          node tests/test_staged_runtime.mjs
          node tests/test_release_archives.mjs

      - name: Validate release contract files
        run: |
          test -f manifest.json
          test -f api.openapi.json
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('api.openapi.json', 'utf8'))"

      - name: Stage runtime package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/stage/bin release/stage/assets release/out
          cp manifest.json api.openapi.json README.md package.json module.json release/stage/
          cp -R dist release/stage/dist
          cp index.html server.py realsense_runtime.py config.example.json release/stage/assets/
          cp requirements-realsense.txt release/stage/
          cp -R scripts patches release/stage/
          cat > release/stage/bin/monitor-server <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          module_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          python_candidates=(
            "${MONITOR_PYTHON:-}"
            "$HOME/.sya/monitor/.venv/bin/python3"
            "python3"
          )
          for python_bin in "${python_candidates[@]}"; do
            if [[ -n "${python_bin}" ]] && command -v "${python_bin}" >/dev/null 2>&1; then
              exec "${python_bin}" "${module_root}/assets/server.py" "$@"
            fi
          done
          echo "No usable Python interpreter found for monitor runtime." >&2
          exit 127
          SCRIPT
          cat > release/stage/bin/monitor-server.cmd <<'SCRIPT'
          @echo off
          set MODULE_ROOT=%~dp0..
          if defined MONITOR_PYTHON (
            "%MONITOR_PYTHON%" "%MODULE_ROOT%\assets\server.py" %*
          ) else if exist "%USERPROFILE%\.sya\monitor\.venv\Scripts\python.exe" (
            "%USERPROFILE%\.sya\monitor\.venv\Scripts\python.exe" "%MODULE_ROOT%\assets\server.py" %*
          ) else (
            python "%MODULE_ROOT%\assets\server.py" %*
          )
          SCRIPT
          chmod +x release/stage/bin/monitor-server
          test -f release/stage/manifest.json
          test -f release/stage/api.openapi.json
          test -x release/stage/bin/monitor-server
          test -f release/stage/bin/monitor-server.cmd
          test -d release/stage/assets
          test -f release/stage/assets/realsense_runtime.py
          test -x release/stage/scripts/realsense-l515
          test -f release/stage/patches/librealsense-v2.54.2-macos-l515.patch

      - name: Smoke test authenticated staged runtime
        run: node scripts/test-staged-runtime.mjs release/stage > release/smoke-result.json

      - name: Create platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          runtime_sha256="$(node -p "JSON.parse(require('fs').readFileSync('release/smoke-result.json', 'utf8')).runtimeSha256")"
          [[ "${runtime_sha256}" =~ ^[a-f0-9]{64}$ ]]
          test "${runtime_sha256}" = "$(node scripts/hash-runtime.mjs release/stage)"
          platforms=(
            "macos-arm64:zip"
            "macos-x64:zip"
            "windows-x64:zip"
            "linux-x64:tar.gz"
          )
          for item in "${platforms[@]}"; do
            platform="${item%%:*}"
            ext="${item#*:}"
            name="sya-function-monitor-${version}-${platform}.${ext}"
            if [[ "${ext}" == "zip" ]]; then
              (cd release/stage && zip -qr "../out/${name}" .)
            else
              tar -czf "release/out/${name}" -C release/stage .
            fi
            verify_dir="release/verify/${platform}"
            mkdir -p "${verify_dir}"
            if [[ "${ext}" == "zip" ]]; then
              unzip -q "release/out/${name}" -d "${verify_dir}"
            else
              tar -xzf "release/out/${name}" -C "${verify_dir}"
            fi
            test "${runtime_sha256}" = "$(node scripts/hash-runtime.mjs "${verify_dir}")"
            node scripts/hash-runtime.mjs release/stage --archive "release/out/${name}" > "release/out/${name}.digests.json"
          done
          test "${runtime_sha256}" = "$(node scripts/hash-runtime.mjs release/stage)"
          (cd release/out && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Monitor Function ${{ steps.meta.outputs.tag }}
          body: |
            Runtime artifacts for the SYA monitor function.

            Each archive contains manifest.json, api.openapi.json, bin/, assets/, README.md, and compiled adapter output.
            Each external .digests.json records archive SHA-256 and the canonical sya-runtime-tree-sha256-v1 digest.
            Consumers must independently recompute both digests before reviewing a lock update.
          files: release/out/*
          fail_on_unmatched_files: true
          make_latest: false
