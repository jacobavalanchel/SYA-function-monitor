name: Release Function Artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.2.0"
      version:
        description: "Artifact version, for example 0.1.0"
        required: true
        default: "0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: monitor-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish monitor artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release source and resolve metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-release-source.mjs > "${RUNNER_TEMP}/monitor-release-source.json"
          node -e 'const fs = require("fs"); const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/monitor-release-source.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${b.tag}\nversion=${b.version}\n`);'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test Python runtime
        run: |
          python -m pip install Pillow==11.3.0
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Test release validation tools
        run: |
          node tests/test_release_digest.mjs
          node tests/test_staged_runtime.mjs
          node tests/test_release_archives.mjs
          node tests/test_release_source.mjs
          node tests/test_stage_package.mjs

      - name: Validate release contract files
        run: |
          test -f manifest.json
          test -f api.openapi.json
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('api.openapi.json', 'utf8'))"

      - name: Stage runtime package
        shell: bash
        run: |
          bash scripts/stage-runtime.sh

      - name: Smoke test authenticated staged runtime
        run: node scripts/test-staged-runtime.mjs release/stage > release/smoke-result.json

      - name: Create platform archives
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash scripts/archive-runtime.sh "${RELEASE_VERSION}" "${RUNNER_TEMP}/monitor-release-source.json"

      - name: Verify binding and create a new GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/verify-release-source.mjs --expected release/out/source-provenance.json > "${RUNNER_TEMP}/monitor-release-verified.json"
          test "${RELEASE_TAG}" = "$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/monitor-release-verified.json', 'utf8')).tag")"
          node scripts/verify-release-assets.mjs release/out "${RELEASE_TAG#v}" > "${RUNNER_TEMP}/monitor-release-assets.txt"
          (cd release/out && sha256sum --check SHA256SUMS.txt)
          assets=()
          while IFS= read -r asset; do
            assets+=("${asset}")
          done < "${RUNNER_TEMP}/monitor-release-assets.txt"
          cat > "${RUNNER_TEMP}/monitor-release-notes.md" <<'NOTES'
            Runtime artifacts for the SYA monitor function.

            Each archive contains manifest.json, api.openapi.json, bin/, assets/, README.md, and compiled adapter output.
            Each external .digests.json records archive SHA-256 and the canonical sya-runtime-tree-sha256-v1 digest.
            source-provenance.json records the verified source commit and existing tag object.
            Consumers must independently recompute both digests before reviewing a lock update.
          NOTES
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --repo "github.com/${GITHUB_REPOSITORY}" --verify-tag --latest=false \
            --title "Monitor Function ${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/monitor-release-notes.md"
