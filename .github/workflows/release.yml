name: Release Function Artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.1"
      version:
        description: "Artifact version, for example 0.1.0"
        required: true
        default: "0.1.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish monitor artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          version="${{ inputs.version }}"
          if [[ -z "${version}" ]]; then
            version="${tag#v}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Validate release contract files
        run: |
          test -f manifest.json
          test -f api.openapi.json
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('api.openapi.json', 'utf8'))"

      - name: Stage runtime package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/stage/bin release/stage/assets release/out
          cp manifest.json api.openapi.json README.md package.json module.json release/stage/
          cp -R dist release/stage/dist
          cp index.html server.py config.example.json release/stage/assets/
          cat > release/stage/bin/monitor-server <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          module_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          exec python3 "${module_root}/assets/server.py" "$@"
          SCRIPT
          chmod +x release/stage/bin/monitor-server
          test -f release/stage/manifest.json
          test -f release/stage/api.openapi.json
          test -x release/stage/bin/monitor-server
          test -d release/stage/assets

      - name: Create platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          platforms=(
            "macos-arm64:zip"
            "macos-x64:zip"
            "windows-x64:zip"
            "linux-x64:tar.gz"
          )
          for item in "${platforms[@]}"; do
            platform="${item%%:*}"
            ext="${item#*:}"
            name="sya-function-monitor-${version}-${platform}.${ext}"
            if [[ "${ext}" == "zip" ]]; then
              (cd release/stage && zip -qr "../out/${name}" .)
            else
              tar -czf "release/out/${name}" -C release/stage .
            fi
          done
          (cd release/out && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Monitor Function ${{ steps.meta.outputs.tag }}
          body: |
            Runtime artifacts for the SYA monitor function.

            Each archive contains manifest.json, api.openapi.json, bin/, assets/, README.md, and compiled adapter output.
          files: release/out/*
          fail_on_unmatched_files: true
          make_latest: false
