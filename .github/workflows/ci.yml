name: Monitor Source Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-13
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.1"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install and build adapter
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Test Python runtime
        run: |
          python -m pip install Pillow==11.3.0
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Test release validation tools without publishing
        run: |
          node tests/test_release_digest.mjs
          node tests/test_staged_runtime.mjs
          node tests/test_release_archives.mjs
          node tests/test_release_source.mjs
          node tests/test_stage_package.mjs

      - name: Stage and smoke test the same runtime recipe as release
        shell: bash
        run: |
          bash scripts/stage-runtime.sh
          node scripts/test-staged-runtime.mjs release/stage > release/smoke-result.json
          bash scripts/archive-runtime.sh "$(node -p "require('./manifest.json').version")"
